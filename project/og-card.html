<!--
  Bespoke Betty — OG share card source (Thread design).
  Rasterize to public/images/og-card.png at 1200×630:
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
      --hide-scrollbars --force-device-scale-factor=1 --window-size=1200,630 \
      --virtual-time-budget=3000 --screenshot=public/images/og-card.png \
      file://$PWD/project/og-card.html
  Fonts: Fraunces (display) + Inter (labels) via Google Fonts CDN — needs network at rasterize time.
  Palette mirrors src/styles/global.css tokens (bg #EDE8E0, text #33302B, accent clay #B08968).
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EDE8E0; --surface:#F7F4EF; --text:#33302B; --muted:#8B857B;
    --line:#CFC4B2; --accent:#B08968;
    --serif:"Fraunces",Georgia,serif; --sans:"Inter",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:1200px;height:630px;}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);}
  .card{
    width:1200px;height:630px;padding:56px;
    display:flex;
  }
  /* dashed "stitch" frame — the brand signature */
  .frame{
    flex:1;border:2px dashed var(--line);border-radius:22px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:48px 64px;position:relative;
  }
  .eyebrow{
    color:var(--accent);font-weight:600;font-size:22px;
    letter-spacing:.22em;text-transform:uppercase;
  }
  .wordmark{
    font-family:var(--serif);font-weight:400;font-size:132px;line-height:1;
    margin:26px 0 0;letter-spacing:-.01em;
  }
  .wordmark em{font-style:italic;color:var(--accent);}
  .divider{
    width:120px;border:0;border-top:2px dashed var(--line);margin:30px 0;
  }
  .tagline{
    color:var(--muted);font-size:30px;line-height:1.4;max-width:30ch;text-wrap:balance;
  }
  .cta{
    margin-top:38px;background:var(--accent);color:#fff;border-radius:999px;
    font-weight:500;font-size:26px;padding:16px 40px;display:inline-flex;gap:12px;align-items:center;
  }
  /* domain, bottom-right of the frame */
  .domain{
    position:absolute;right:40px;bottom:34px;
    color:var(--muted);font-size:20px;letter-spacing:.02em;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="frame">
      <div class="eyebrow">Handmade · Made to order</div>
      <h1 class="wordmark">Bespoke <em>Betty</em></h1>
      <hr class="divider">
      <p class="tagline">Custom shirts, hoodies &amp; cushions — made just for you.</p>
      <div class="cta">See the work&nbsp;→</div>
      <div class="domain">bespokebetty.com.au</div>
    </div>
  </div>
</body>
</html>
